<!DOCTYPE html><html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gra eliminacyjna</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 1em; }
    h1 { text-align: center; margin-bottom: 0.5em; }
    .bracket {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1em;
    }
    .round {
      display: flex;
      flex-direction: column;
    }
    .round-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 0.5em;
      font-size: 0.9em;
      text-transform: uppercase;
    }
    .match {
      display: flex;
      margin-bottom: 0.5em;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
    }
    .team {
      flex: 1;
      padding: 0.5em;
      text-align: center;
      cursor: pointer;
      background: #f9f9f9;
      transition: background 0.2s;
    }
    .team.selected {
      background: #a5d6a7;
    }
    #champion {
      margin-top: 1.5em;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .bracket {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Gra eliminacyjna</h1>
  <div id="bracket" class="bracket"></div>
  <div id="champion"></div>
  <script>
    const participants = [
      'Skłodowska-Curie','Dmowski',
      'Chrobry','Chopin',
      'Małysz','Sienkiewicz',
      'Prus','Szewińska',
      'Rutkiewicz','Mickiewicz',
      'Słowacki','Miłosz',
      'Lewandowski','Świątek',
      'Jagiełło','Kopernik',
      'Piłsudski','Górski',
      'Wajda','Mieszko I',
      'Pilecki','Kazimierz Wielki',
      'Żółkiewski','Popiełuszko',
      'Jadwiga','Sobieski',
      'Kościuszko','Paderewski',
      'Jan Paweł II','Szymborska',
      'Wałęsa','Gombrowicz'
    ];const roundNames = [
  '1/16 Finału',
  '1/8 Finału',
  'Ćwierćfinał',
  'Półfinał',
  'Finał'
];

function createBracket(list) {
  const bracket = document.getElementById('bracket');
  const rounds = [];
  let current = list.slice();
  rounds.push(current);
  while (current.length > 2) {
    current = Array(current.length / 2).fill('');
    rounds.push(current);
  }

  rounds.forEach((roundTeams, roundIndex) => {
    const roundEl = document.createElement('div');
    roundEl.className = 'round';

    const titleEl = document.createElement('div');
    titleEl.className = 'round-title';
    titleEl.textContent = roundNames[roundIndex] || '';
    roundEl.appendChild(titleEl);

    const matchesCount = Math.ceil(roundTeams.length / 2);
    for (let m = 0; m < matchesCount; m++) {
      const matchEl = document.createElement('div');
      matchEl.className = 'match';
      for (let i = 0; i < 2; i++) {
        const teamEl = document.createElement('div');
        teamEl.className = 'team';
        const name = roundTeams[m * 2 + i] || '';
        teamEl.textContent = name;
        teamEl.addEventListener('click', () => selectTeam(roundIndex, m, i));
        matchEl.appendChild(teamEl);
      }
      roundEl.appendChild(matchEl);
    }
    bracket.appendChild(roundEl);
  });
}

function selectTeam(roundIndex, matchIndex, teamIndex) {
  const bracket = document.getElementById('bracket');
  const rounds = bracket.querySelectorAll('.round');
  const currentMatch = rounds[roundIndex].querySelectorAll('.match')[matchIndex];
  const teams = currentMatch.querySelectorAll('.team');
  teams.forEach((team, idx) => {
    team.classList.toggle('selected', idx === teamIndex);
  });
  const winner = teams[teamIndex].textContent;
  const nextRoundIndex = roundIndex + 1;
  if (nextRoundIndex < rounds.length) {
    const nextMatchEl = rounds[nextRoundIndex].querySelectorAll('.match')[Math.floor(matchIndex / 2)];
    const slot = matchIndex % 2;
    const nextTeams = nextMatchEl.querySelectorAll('.team');
    nextTeams[slot].textContent = winner;
  } else {
    document.getElementById('champion').textContent = 'Zwycięzca: ' + winner;
  }
}

createBracket(participants);

  </script>
</body>
</html>
